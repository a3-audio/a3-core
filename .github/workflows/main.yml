name: Build Debian Package

on:
  push:
    branches: [ main, deploy ]
  release:
    types: [published]

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build .deb
        run: |
          cd platform-config/debian-x86_64/a3-core
          dpkg-deb --build . ../../a3-core.deb
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: a3-core.deb
          path: platform-config/debian-x86_64/a3-core/a3-core.deb
