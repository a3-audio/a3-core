name: Build Debian Package

on:
  push:
    branches: [ main, deploy ]
  release:
    types: [published]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Optional: Add test steps here
      # - name: Run tests
      #   run: pytest
      - name: Build .deb
        run: |
          cd platform-config/debian-x86_64
          dpkg-deb --build --root-owner-group a3-core
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: a3-core.deb
          path: platform-config/debian-x86_64/a3-core.deb
      - name: Import GPG Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "Missing secret GPG_PRIVATE_KEY. Please add it to repository secrets." >&2
            exit 2
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Create apt repo
        run: |
          mkdir -p repo
          cp platform-config/debian-x86_64/a3-core.deb repo/
          cd repo
          dpkg-scanpackages . /dev/null | gzip -9c > Packages.gz
      - name: Sign Packages.gz
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd repo
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign Packages.gz
          else
            gpg --batch --yes --armor --detach-sign Packages.gz
          fi
      - name: Export public GPG key
        run: |
          cd repo
          KEYID=$(gpg --list-keys --with-colons | awk -F: '/^pub/{print $5; exit}')
          if [ -z "$KEYID" ]; then
            echo "No public key found to export" >&2
            exit 2
          fi
          gpg --armor --export "$KEYID" > KEY.gpg
      - name: Upload apt repo to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: repo
