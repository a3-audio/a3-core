name: Build and Release Debian Package

on:
  push:
    branches: [ deploy, main ]
  release:
    types: [published]

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: |
          cd platform-config/debian-x86_64
          dpkg-deb --build --root-owner-group a3-core
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: a3-core.deb
          path: platform-config/debian-x86_64/a3-core.deb
      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: platform-config/debian-x86_64/a3-core.deb
