name: Build APT Repo

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    # The rig is Debian testing: dpkg-shlibdeps writes Depends against Debian's
    # libraries, where an Ubuntu build would name Ubuntu's.
    container: debian:testing
    env:
      CCACHE_DIR: /github/home/.ccache

    steps:
      # git first: actions/checkout needs it to fetch the history and the submodule.
      - name: Checkout tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The whole history: the package version is read off the tags, and a
          # shallow clone has none. Submodules: IEM only (top level, not IEM's JUCE).
          fetch-depth: 0
          submodules: true

      - name: Trust the workspace
        run: git config --global --add safe.directory '*'

      - name: Build tools
        run: |
          apt-get update
          xargs -a packaging/build-depends apt-get install -y --no-install-recommends

      - name: Import private key
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Cache JUCE
        id: juce
        uses: actions/cache@v4
        with:
          path: /opt/juce
          key: juce-9.0.3-debian-testing-v1

      - name: Build JUCE
        if: steps.juce.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 9.0.3 https://github.com/juce-framework/JUCE.git /tmp/JUCE
          cmake -S /tmp/JUCE -B /tmp/JUCE/build -DCMAKE_INSTALL_PREFIX=/opt/juce -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/JUCE/build --target install -j4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /github/home/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      # The same recipe the LAN builder uses: it builds the program, stamps the
      # version (last tag plus commits since) and
      # prints the .deb's path as its last line.
      - name: Build .deb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/package.py" https://raw.githubusercontent.com/a3-audio/a3-system/main/installer/package.py
          DEB=$(python3 -I "$RUNNER_TEMP/package.py" "$GITHUB_WORKSPACE" --rev HEAD --out "$RUNNER_TEMP/debs" --cache "$RUNNER_TEMP/work" --juce /opt/juce --jobs 4 | tail -n 1)
          mkdir -p repo
          cp "$DEB" repo/a3-core.deb
          dpkg-deb --field repo/a3-core.deb Version Depends
          ls -l repo/a3-core.deb

      - name: Generate Packages and Release
        run: |
          dpkg-scanpackages repo /dev/null > Packages
          gzip -9c Packages > Packages.gz

          DATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")
          printf '%s\n' \
            "Origin: a3-audio" \
            "Label: a3-core" \
            "Suite: stable" \
            "Codename: stable" \
            "Date: $DATE" \
            "Architectures: amd64" \
            "Components: main" \
            "Description: a3-core apt repository" > Release

          # normalize Release (strip any leading whitespace) before computing hashes
          sed -i 's/^[[:space:]]*//' Release || true

          # produce MD5Sum, SHA1 and SHA256 blocks with relative filenames
          echo "MD5Sum:" >> Release
          for f in a3-core.deb Packages Packages.gz Release; do
            if [ -f "$f" ]; then
              md5=$(md5sum "$f" | cut -d' ' -f1)
              size=$(stat -c%s "$f")
              printf " %s %d %s\n" "$md5" "$size" "$f" >> Release
            fi
          done

          echo "SHA1:" >> Release
          for f in a3-core.deb Packages Packages.gz Release; do
            if [ -f "$f" ]; then
              sha1=$(sha1sum "$f" | cut -d' ' -f1)
              size=$(stat -c%s "$f")
              printf " %s %d %s\n" "$sha1" "$size" "$f" >> Release
            fi
          done

          echo "SHA256:" >> Release
          for f in a3-core.deb Packages Packages.gz Release; do
            if [ -f "$f" ]; then
              sha256=$(sha256sum "$f" | cut -d' ' -f1)
              size=$(stat -c%s "$f")
              printf " %s %d %s\n" "$sha256" "$size" "$f" >> Release
            fi
          done
          # (Release was normalized before hashes)

      - name: Sign Release
        run: |
          gpg --batch --yes --armor --detach-sign -o Release.gpg Release

      - name: Export public key
        run: |
          KEYID=$(gpg --list-keys --with-colons | awk -F: '/^pub/{print $5; exit}') || true
          if [ -n "$KEYID" ]; then
            gpg --armor --export "$KEYID" > KEY.gpg || true
          fi

      - name: Show Release (debug)
        run: |
          echo "--- Release content start ---"
          sed -n '1,200p' Release || true
          echo "--- Release content end ---"

      - name: Prepare public dir for Pages
        run: |
          rm -rf public
          mkdir -p public
          # publish repo files under public/repo so package paths in Packages match
          mkdir -p public/repo
          cp -r repo/* public/repo/ || true
          cp Packages.gz public/ || true
          # copy Release into public/Release (Release was normalized earlier)
          cp Release public/Release || true
          cp Release.gpg public/Release.gpg || true
          [ -f KEY.gpg ] && cp KEY.gpg public/KEY.gpg || true
          # prevent GitHub Pages (Jekyll) from processing files — serve raw files as-is
          touch public/.nojekyll

      - name: Verify published Release bytes (debug)
        run: |
          echo '--- hexdump public/Release (first 80 lines) ---'
          hexdump -C public/Release | sed -n '1,80p' || true
          echo '--- public/Release text start ---'
          sed -n '1,80p' public/Release || true
          echo '--- public/Release text end ---'

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

          
