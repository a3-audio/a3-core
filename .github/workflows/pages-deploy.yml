name: Deploy apt repo to GitHub Pages

on:
  push:
    branches: [ main, deploy ]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .deb
        run: |
          cd platform-config/debian-x86_64
          dpkg-deb --build --root-owner-group a3-core
      - name: Import GPG Key
        env:
          GPG_KEY: ${{ secrets.PGP_KEY }}
        run: |
          echo "$GPG_KEY" | gpg --batch --import
      - name: Create apt repo
        run: |
          mkdir -p repo
          cp platform-config/debian-x86_64/a3-core.deb repo/
          cd repo
          dpkg-scanpackages . /dev/null | gzip -9c > Packages.gz
          gpg --batch --yes --armor --detach-sign Packages.gz
          gpg --export --armor $(gpg --list-keys --with-colons | awk -F: '/^pub/{print $5}') > KEY.gpg
          MD5SUM=$(md5sum Packages.gz | awk '{print $1}')
          SHA1SUM=$(sha1sum Packages.gz | awk '{print $1}')
          SHA256SUM=$(sha256sum Packages.gz | awk '{print $1}')
          SIZE=$(stat -c%s Packages.gz)
          DATE=$(date -R)
          cat > Release <<EOF
            Origin: a3-core
            Label: a3-core
            Suite: stable
            Version: 1.0
            Codename: a3core
            Architectures: amd64
            Components: main
            Description: a3-core apt repository
            Date: $DATE
            MD5Sum:
            $MD5SUM $SIZE Packages.gz
            SHA1:
            $SHA1SUM $SIZE Packages.gz
            SHA256:
            $SHA256SUM $SIZE Packages.gz
          EOF
          gpg --batch --yes --armor --output Release.gpg --detach-sign Release
      - name: Add index.html for repo
        run: |
          cat > repo/index.html <<'EOF'
            <!DOCTYPE html>
            <html>
              <head><title>a3-core apt repo</title></head>
              <body>
                <h1>a3-core apt repository</h1>
                <ul>
                  <li><a href="Packages.gz">Packages.gz</a></li>
                  <li><a href="KEY.gpg">KEY.gpg</a></li>
                  <li><a href="a3-core.deb">a3-core.deb</a></li>
                  <li><a href="Release">Release</a></li>
                  <li><a href="Release.gpg">Release.gpg</a></li>
                </ul>
              </body>
            </html>
            EOF
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
