name: Build APT Repo

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y dpkg-dev gnupg

      - name: Import private key
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Build .deb
        run: |
          cd platform-config/debian-x86_64
          dpkg-deb --build --root-owner-group a3-core

      - name: Generate Packages and Release
        run: |
          mkdir -p repo
          cp platform-config/debian-x86_64/a3-core.deb repo/

          dpkg-scanpackages repo /dev/null > Packages
          gzip -9c Packages > Packages.gz

          DATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")
          printf '%s\n' \
            "Origin: a3-audio" \
            "Label: a3-core" \
            "Suite: stable" \
            "Codename: stable" \
            "Date: $DATE" \
            "Architectures: amd64" \
            "Components: main" \
            "Description: a3-core apt repository" > Release

          # normalize Release (strip any leading whitespace) before computing hashes
          sed -i 's/^[[:space:]]*//' Release || true

          # produce MD5Sum, SHA1 and SHA256 blocks with relative filenames
          echo "MD5Sum:" >> Release
          for f in a3-core.deb Packages Packages.gz Release; do
            if [ -f "$f" ]; then
              md5=$(md5sum "$f" | cut -d' ' -f1)
              size=$(stat -c%s "$f")
              printf " %s %d %s\n" "$md5" "$size" "$f" >> Release
            fi
          done

          echo "SHA1:" >> Release
          for f in a3-core.deb Packages Packages.gz Release; do
            if [ -f "$f" ]; then
              sha1=$(sha1sum "$f" | cut -d' ' -f1)
              size=$(stat -c%s "$f")
              printf " %s %d %s\n" "$sha1" "$size" "$f" >> Release
            fi
          done

          echo "SHA256:" >> Release
          for f in a3-core.deb Packages Packages.gz Release; do
            if [ -f "$f" ]; then
              sha256=$(sha256sum "$f" | cut -d' ' -f1)
              size=$(stat -c%s "$f")
              printf " %s %d %s\n" "$sha256" "$size" "$f" >> Release
            fi
          done
          # (Release was normalized before hashes)

      - name: Sign Release
        run: |
          gpg --batch --yes --armor --detach-sign -o Release.gpg Release

      - name: Export public key
        run: |
          KEYID=$(gpg --list-keys --with-colons | awk -F: '/^pub/{print $5; exit}') || true
          if [ -n "$KEYID" ]; then
            gpg --armor --export "$KEYID" > KEY.gpg || true
          fi

      - name: Show Release (debug)
        run: |
          echo "--- Release content start ---"
          sed -n '1,200p' Release || true
          echo "--- Release content end ---"

      - name: Prepare public dir for Pages
        run: |
          rm -rf public
          mkdir -p public
          cp a3-core.deb public/ || true
          cp Packages.gz public/ || true
          # copy Release into public/Release (Release was normalized earlier)
          cp Release public/Release || true
          cp Release.gpg public/Release.gpg || true
          [ -f KEY.gpg ] && cp KEY.gpg public/KEY.gpg || true
          # prevent GitHub Pages (Jekyll) from processing files — serve raw files as-is
          touch public/.nojekyll

      - name: Verify published Release bytes (debug)
        run: |
          echo '--- hexdump public/Release (first 80 lines) ---'
          hexdump -C public/Release | sed -n '1,80p' || true
          echo '--- public/Release text start ---'
          sed -n '1,80p' public/Release || true
          echo '--- public/Release text end ---'

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

          
