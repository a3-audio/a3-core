name: Build APT Repo

on:
  push:
    branches: [ main ]
    paths:
      - "a3-core.deb"
      - ".github/workflows/build-repo.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y dpkg-dev gnupg

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Build repo structure
        run: |
          rm -rf repo
          mkdir -p repo/pool
          cp a3-core.deb repo/pool/

          mkdir -p repo/dists/stable/main/binary-amd64
          - name: Export public GPG key
            run: |
              # extract first pub keyid and export armored public key
              KEYID=$(gpg --list-keys --with-colons | awk -F: '/^pub/{print $5; exit}')
              if [ -z "$KEYID" ]; then
                echo "No GPG key found after import" >&2
                exit 2
              fi
              gpg --armor --export "$KEYID" > KEY.gpg

          dpkg-scanpackages repo/pool /dev/null > repo/dists/stable/main/binary-amd64/Packages
          gzip -9c repo/dists/stable/main/binary-amd64/Packages > repo/dists/stable/main/binary-amd64/Packages.gz

      - name: Generate Release
        working-directory: repo/dists/stable
        run: |
          cat > Release <<EOF
            Origin: a3-audio
            Label: a3-core
            Suite: stable
            Codename: stable
            Date: $(date -Ru)
            Architectures: amd64
            Components: main
            Description: a3-core apt repository
          EOF

          echo "MD5Sum:" >> Release
          find . -type f -name "Packages*" | while read f; do
            size=$(stat -c%s "$f")
            md5=$(md5sum "$f" | cut -d' ' -f1)
            printf " %s %d %s\n" "$md5" "$size" "$f" >> Release
          done

          echo "SHA256:" >> Release
          find . -type f -name "Packages*" | while read f; do
            size=$(stat -c%s "$f")
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            printf " %s %d %s\n" "$sha" "$size" "$f" >> Release
          done

      - name: Sign Release
        working-directory: repo/dists/stable
        run: |
          gpg --batch --yes --armor --detach-sign -o Release.gpg Release
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}

      - name: Flatten repo for GitHub Pages
        run: |
          rm -rf public
          mkdir public

          cp repo/pool/a3-core.deb public/
          cp repo/dists/stable/main/binary-amd64/Packages.gz public/
          cp repo/dists/stable/Release public/
          cp repo/dists/stable/Release.gpg public/
          cp KEY.gpg public/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
