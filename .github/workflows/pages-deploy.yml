name: Build APT Repo

on:
  push:
    branches: [ main ]
    paths:
      - "a3-core.deb"
      - ".github/workflows/repo.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y dpkg-dev gnupg

      - name: Import private key
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Build .deb
        run: |
          cd platform-config/debian-x86_64
          dpkg-deb --build --root-owner-group a3-core

      - name: Generate Packages and Release
        run: |
          mkdir -p repo
          cp platform-config/debian-x86_64/a3-core.deb repo/

          dpkg-scanpackages repo /dev/null > Packages
          gzip -9c Packages > Packages.gz

          cat > Release <<'EOF'
              Origin: a3-audio
              Label: a3-core
              Suite: stable
              Codename: stable
              Date: $(date -Ru)
              Architectures: amd64
              Components: main
              Description: a3-core apt repository
            EOF
          echo "SHA256:" >> Release
          for f in a3-core.deb Packages Packages.gz Release; do
            [ -f "$f" ] && printf " %s %d %s\n" "$(sha256sum "$f" | cut -d' ' -f1)" "$(stat -c%s "$f")" "$f" >> Release
          done

      - name: Sign Release
        run: |
          gpg --batch --yes --armor --detach-sign -o Release.gpg Release

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .

