# a3-core: the panel is 1024x768 mounted upright, so 768x1024, and its touch
# turned to match. Set here rather than by xrandr from i3: X comes up rotated,
# with no off-and-on of the output after the start, which is what the apps saw
# as a 512x384 screen and the wrong scale (see a3-wait-for-the-screen).
# HDMI-A-0 and HDMI-A-1 are the amdgpu driver's names for the two HDMI ports
# (modesetting: HDMI-1, HDMI-2). Both are rotated: the touch below matches the
# device, not the port, so a panel on an unrotated port gets its touch turned
# and its picture not.
Section "Monitor"
    Identifier "HDMI-A-0"
    Option     "Rotate" "right"
    Option     "PreferredMode" "1024x768"
EndSection

Section "Monitor"
    Identifier "HDMI-A-1"
    Option     "Rotate" "right"
    Option     "PreferredMode" "1024x768"
EndSection

Section "InputClass"
    Identifier         "a3 touchscreen rotate right"
    MatchIsTouchscreen "on"
    MatchDriver        "libinput"
    Option             "CalibrationMatrix" "0 1 0 -1 0 1 0 0 1"
EndSection
