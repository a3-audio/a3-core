# x11vnc encodes the whole screen; with a client connected it took a large
# share of a CPU the audio threads need (a3nuc1, 2026-10-17). Audio runs on
# CPUs 1-3, so this stays on CPU 0. Affinity only, no scheduling policy.
#
# A drop-in, not a line in x11vnc.service: that file is a conffile the rig
# already holds a .dpkg-dist of.

[Service]
CPUAffinity=0
