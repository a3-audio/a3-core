#
# Run ptp4l with the package's config (step_threshold, grandmaster priority)
# instead of linuxptp's stock /etc/linuxptp/ptp4l.conf.
#
# --free_running 1 (2026-10-30, one clock): ptp4l never adjusts this machine's
# PTP clock. The program's clock role (a3-core --role clock, a3-clock.service)
# steers it from the Scarlett, so PTP time runs at the Scarlett's rate; should
# another grandmaster ever win, two controllers must not fight over the clock.
# On the command line, it beats the config file, a conffile dpkg may keep old.

[Service]
ExecStart=
ExecStart=/usr/sbin/ptp4l -f /etc/linuxptp/a3-ptp4l.conf -i %I --free_running 1
