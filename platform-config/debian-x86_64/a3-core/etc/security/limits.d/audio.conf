# Realtime for the audio group, shipped by a3-core (it came with the jackd
# package until jackd left the Core, 2026-10-14). PipeWire's module-rt puts
# its data loop at FIFO 83 only when rtprio allows more than that; 95 is the
# USB IRQ threads' priority, which stays above everything else.

@audio   -  rtprio     95
@audio   -  memlock    unlimited
@audio   -  nice      -19
