# The profiler is how the Core's clock role (a3-clock) reads the Scarlett's sample clock: it runs `pw-profiler -J`.
# By default the module writes one record per graph cycle, each with every node of the graph in it. At a block of 64
# that is 689 records a second; the role cannot drain them, the module's queue overflows ("mod.profiler: queue full",
# about 80 times a second, logged from the real-time thread), the main PipeWire's memory grows by 10 MB a minute, the
# Scarlett driver node collects errors and the role loses records until it ends in "fault" (2026-11-07).
# The role needs about one measurement a second, so a record every 10 ms (100 a second) is plenty.
# (Takes effect when PipeWire starts: a reboot or a restart of the audio services.)
module.profiler.args = {
    profile.interval.ms = 10
}
