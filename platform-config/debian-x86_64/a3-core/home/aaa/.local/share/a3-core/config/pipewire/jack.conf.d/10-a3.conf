# JACK programs on the rig run through PipeWire as they ran on jackd: the
# Scarlett (the default device, pro-audio profile) answers as "system", so the
# patchbay's system:playback_N / system:capture_N still fit, and the block
# is 128 samples at 44.1 kHz (2.9 ms).
jack.properties = {
    node.latency           = 128/44100
    jack.default-as-system = true
}
