# The Core is the a3-core program's core role (/usr/bin/a3-core, shipped by the
# a3-engine package) since the cut.
#
# A drop-in rather than an edit of a3-core.service: the postinst never
# overwrites a unit the rig already has, so only a new file reaches an
# installed machine. The empty ExecStart= drops whatever came before -- the
# unit's line and a hand override.conf alike, which sorts before this file.
[Unit]
Description=a3-core (the a3-core program's core role)

[Service]
ExecStart=
ExecStart=/usr/bin/a3-core --role core
