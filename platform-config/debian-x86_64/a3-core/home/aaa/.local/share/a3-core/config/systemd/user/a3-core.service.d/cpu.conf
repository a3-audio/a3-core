# Core runs on any CPU. It was pinned to CPU 0, the CPU the Motion UI draws on;
# whenever the UI peaked, Core got no time and the kernel dropped OSC packets
# on port 9000 (14,461 in seven minutes on 2026-09-26). The audio threads on
# the other CPUs run real-time, so an ordinary Core only takes what they leave.
#
# A drop-in rather than a line in a3-core.service: the postinst copies the
# config with `cp -rn`, which never overwrites an existing unit, so only a new
# file reaches a rig that is already installed. The empty value resets the
# mask -- every CPU, however many the machine has.

[Service]
CPUAffinity=
