# The rig runs at 44.1 kHz end to end (JACK, REAPER, the stems), and the AES67
# streams carry 44.1 kHz: a driver at 48 kHz would resample every packet.
# The block never goes below 64 samples (1.45 ms; 30 min without an xrun at REAPER 51-61 % of a cycle, 32 failed at once, measured 2026-10-17; 128 before): the AES67
# nodes share their PTP clock with every node connected to them, REAPER and the
# Scarlett included, and their 0.5 ms packets would otherwise pull the whole
# graph down to 32 samples, more than REAPER and the Scarlett can keep up with.
context.properties = {
    default.clock.rate          = 44100
    default.clock.allowed-rates = [ 44100 ]
    default.clock.quantum       = 64
    default.clock.min-quantum   = 64
}
