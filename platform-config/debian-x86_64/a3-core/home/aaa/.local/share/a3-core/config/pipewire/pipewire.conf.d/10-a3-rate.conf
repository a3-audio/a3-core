# The rig runs at 44.1 kHz end to end (JACK, the engine, the stems), and the AES67
# streams carry 44.1 kHz: a driver at 48 kHz would resample every packet.
# The block never goes below 64 samples (1.45 ms). 64 ran from 2026-10-17 until a restart on 2026-10-25 put REAPER
# at 67-76 % of the cycle and the Scarlett at ~160 xruns a second, and the rig went back to 128. The C++ engine with
# FFTW and 2nd-order headphones runs at about half the CPU: 49-57 % DSP load at 64 with a full set of sources on
# 2026-11-06, 3 xruns in the session. 32 failed at once. The AES67
# nodes share their PTP clock with every node connected to them, the engine and the
# Scarlett included, and their 0.5 ms packets would otherwise pull the whole
# graph down to 32 samples, more than the engine and the Scarlett can keep up with.
context.properties = {
    default.clock.rate          = 44100
    default.clock.allowed-rates = [ 44100 ]
    default.clock.quantum       = 64
    default.clock.min-quantum   = 64
}
