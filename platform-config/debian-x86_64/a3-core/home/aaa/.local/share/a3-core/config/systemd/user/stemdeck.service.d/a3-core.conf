# On a Core, StemDeck goes and comes with a3-jack: after a reboot with a late
# sound card it started without JACK and stayed down when JACK came up
# (2026-10-02). Its own unit no longer names a3-jack -- StemDeck may run on a
# machine without the Core (2026-10-05) -- so the Core adds the binding here.
[Unit]
After=a3-jack.service
BindsTo=a3-jack.service
