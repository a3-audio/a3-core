# What is A3 about the beat-analyzer package's unit: it is part of the rig,
# comes after JACK, and stays off CPU 0. The unit itself is the package's
# (/usr/lib/systemd/user/beat-analyzer.service); its OSC targets are rendered
# into ~/.config/beat-analyzer/conf.d/50-a3-osc.env (a3-osc-render).
[Unit]
PartOf=a3-main.service
After=a3-jack.service

[Service]
# JACK's ports are there a moment after its unit counts as started.
ExecStartPre=/bin/sleep 3
# No CPUScheduling here: raising the whole process put all its threads, OSC
# and analysis included, above JACK's process threads (late clients on
# a3nuc1, 2026-10-06). The audio threads get their priority from JACK
# (server -P minus 5).
CPUAffinity=1 2 3
