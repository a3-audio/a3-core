# The rig runs at 44.1 kHz end to end (JACK, the engine, the stems), and the AES67
# streams carry 44.1 kHz: a driver at 48 kHz would resample every packet.
# The block never goes below 128 samples (2.9 ms). 64 ran from 2026-10-17 (30 min clean at REAPER 51-61 %
# of a cycle) until a restart on 2026-10-25 put REAPER at 67-76 % and the Scarlett at ~160 xruns a second;
# 128 runs clean. 32 failed at once. The AES67
# nodes share their PTP clock with every node connected to them, the engine and the
# Scarlett included, and their 0.5 ms packets would otherwise pull the whole
# graph down to 32 samples, more than the engine and the Scarlett can keep up with.
context.properties = {
    default.clock.rate          = 44100
    default.clock.allowed-rates = [ 44100 ]
    default.clock.quantum       = 128
    default.clock.min-quantum   = 128
}
