# The bar is the a3-core program's i3-bar role (/usr/bin/a3-core, shipped by
# the a3-engine package) since the cut. A drop-in for the same reason as
# a3-core.service.d/program.conf: an installed unit is never overwritten.
[Service]
ExecStart=
ExecStart=/usr/bin/a3-core --role i3-bar
