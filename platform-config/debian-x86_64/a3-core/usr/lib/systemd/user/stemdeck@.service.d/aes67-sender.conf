# On a Core a deck sends its audio over AES67 like every other deck (2026-11-18):
# StemDeck links its ports to the deck's senders (a3-aes67-deck@<X>, three sessions:
# MAIN, AUX, CUE), and the Core receives them from the network. The Core's map
# differs from the deck host's in one place: the recording comes from a3-engine.
[Unit]
Wants=a3-aes67-deck@%i.service
After=a3-aes67-deck@%i.service

[Service]
Environment=STEMDECK_LINK_MAP=/usr/share/stemdeck/links-aes67-core.json
