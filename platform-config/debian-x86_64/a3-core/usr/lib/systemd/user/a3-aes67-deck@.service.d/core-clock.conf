# On a Core the PTP0 driver is a3-aes67.service, not the deck host's base instance
# (stemdeck-aes67.service, which its condition keeps off here): the senders of the
# Core's own decks join that driver, so they start after it.
[Unit]
Wants=a3-aes67.service
After=a3-aes67.service
