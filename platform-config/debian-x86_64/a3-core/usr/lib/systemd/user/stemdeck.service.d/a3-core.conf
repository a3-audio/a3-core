# On a Core, StemDeck goes and comes with the audio server: after a reboot with
# a late sound card it started without one and stayed down when it came up
# (2026-10-02). Its own unit names no audio server -- StemDeck may run on a
# machine without the Core (2026-10-05) -- so the Core adds the binding here.
# The server is PipeWire since 2026-10-13 (it was a3-jack).
[Unit]
After=pipewire.service wireplumber.service
BindsTo=pipewire.service
