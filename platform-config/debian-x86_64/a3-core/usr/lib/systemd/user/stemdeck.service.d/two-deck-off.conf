# On a Core the B-format decks run as stemdeck@ (a3-main pulls in
# stemdeck@A.service); the two-deck player, enabled globally by its own
# package, never starts here. No Conflicts=: a conflict between units in one
# transaction drops a start job before any condition runs (2026-10-27).
[Service]
ExecCondition=/bin/false
